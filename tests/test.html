<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F6FED'/%3E%3Ctext x='16' y='22' font-family='Segoe UI,Arial,sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EES%3C/text%3E%3C/svg%3E">
  <title>Event Storm Board — Model Tests</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: #f5f7fb; color: #141b26; margin: 0; padding: 32px; }
    main { max-width: 920px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: #5b6b80; font-size: 13px; margin: 0 0 20px; }
    .summary { display: flex; gap: 10px; margin-bottom: 16px; }
    .pill { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .pill.pass { background: #e6f6ec; color: #17663f; }
    .pill.fail { background: #fdecea; color: #a32a1e; }
    .pill.total { background: #eef1f6; color: #5b6b80; }
    ol { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
    li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; background: #fff; border: 1px solid #e2e7ef; border-radius: 8px; font-size: 12.5px; }
    li .mark { font-weight: 800; width: 16px; flex: 0 0 auto; }
    li.ok .mark { color: #1f7a4d; }
    li.bad .mark { color: #c4382c; }
    li.bad { border-color: #edcbc7; background: #fffafa; }
    .detail { display: block; margin-top: 4px; color: #c4382c; font-family: Consolas, monospace; font-size: 11.5px; white-space: pre-wrap; }
    .group { margin: 18px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8494a8; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Event Storm Board — model &amp; state tests</h1>
    <p class="sub">Framework-free assertions over the data model, validation, undo history and store. Open this file directly in a browser.</p>
    <div class="summary" id="summary"></div>
    <ol id="results"></ol>
  </main>

  <script src="../modules/core/model.js"></script>
  <script src="../modules/core/validate.js"></script>
  <script src="../modules/core/history.js"></script>
  <script src="../modules/core/projects.js"></script>
  <script src="../modules/core/store.js"></script>
  <script src="../modules/core/files.js"></script>
  <script src="../modules/io/project-io.js"></script>
  <script src="tests.js"></script>
</body>
</html>
